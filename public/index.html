<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>最简对话 demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0f1115;
        color: #e6e8ee;
        font: 15px/1.6 -apple-system, "PingFang SC", sans-serif;
      }
      #app {
        max-width: 640px;
        height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid #262b36;
        font-weight: 600;
      }
      #list {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user { align-self: flex-end; background: #4c8dff; color: #fff; }
      .assistant {
        align-self: flex-start;
        background: #171a21;
        border: 1px solid #262b36;
      }
      .empty { color: #8b93a5; text-align: center; margin-top: 40px; }
      form {
        display: flex;
        gap: 8px;
        padding: 14px 20px 20px;
        border-top: 1px solid #262b36;
      }
      input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #262b36;
        background: #171a21;
        color: inherit;
        font: inherit;
        outline: none;
      }
      input:focus { border-color: #4c8dff; }
      button {
        padding: 0 18px;
        border: none;
        border-radius: 10px;
        background: #4c8dff;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>最简对话 demo（无模型 · 无流式）</header>
      <div id="list"><p class="empty">说点什么，后端会原样回显。</p></div>
      <form id="form">
        <input id="input" placeholder="说点什么…" autocomplete="off" />
        <button id="send">发送</button>
      </form>
    </div>

    <script>
      const list = document.getElementById('list');
      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const send = document.getElementById('send');

      function add(role, text) {
        list.querySelector('.empty')?.remove();
        const el = document.createElement('div');
        el.className = `msg ${role}`;
        el.textContent = text;
        list.appendChild(el);
        list.scrollTop = list.scrollHeight;
      }

      // 刷新后恢复历史
      fetch('/api/messages')
        .then((r) => r.json())
        .then((d) => d.messages.forEach((m) => add(m.role, m.content)))
        .catch(() => {});

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        add('user', text);
        input.value = '';
        send.disabled = true;

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ text }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || '请求失败');
          add('assistant', data.reply);
        } catch (err) {
          add('assistant', `出错：${err.message}`);
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
